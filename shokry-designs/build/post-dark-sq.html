<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Aref+Ruqaa:wght@700&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1080px;overflow:hidden;font-family:Cairo,sans-serif;background:#000}
.post{position:relative;width:1080px;height:1080px;background:url(BG) center top/cover no-repeat}
.top{position:absolute;inset:0 0 auto 0;height:440px;background:linear-gradient(180deg,rgba(6,7,9,.85) 0%,rgba(10,11,14,.45) 60%,rgba(0,0,0,0) 100%)}
.bot{position:absolute;inset:auto 0 0 0;height:300px;background:linear-gradient(0deg,rgba(5,6,8,.95) 0%,rgba(10,11,14,.6) 55%,rgba(0,0,0,0) 100%)}
.logo{position:absolute;top:44px;left:48px;width:128px;height:128px;border-radius:50%;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 0 6px rgba(225,30,36,.55);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:116px;height:116px}
.head{position:absolute;top:36px;right:52px;text-align:right;color:#fff}
.kicker{font-weight:600;font-size:42px;line-height:1.2;opacity:.95}
.big{font-weight:900;font-size:100px;line-height:1.1;letter-spacing:-1px;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.big em{font-style:normal;color:#ff2a2f;text-shadow:0 0 28px rgba(255,30,40,.55)}
.pill{display:inline-block;margin-top:30px;background:#e31e24;color:#fff;font-weight:800;font-size:30px;padding:5px 22px 9px;border-radius:14px;box-shadow:0 6px 24px rgba(227,30,36,.5)}
.foot{position:absolute;bottom:50px;left:48px;right:52px;display:flex;align-items:flex-end;justify-content:space-between;color:#fff}
.sig{font-family:'Aref Ruqaa',serif;font-size:54px;line-height:1;color:#fff}
.sig b{color:#ff2a2f}
.wa{direction:ltr;display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);padding:8px 22px 10px;border-radius:60px;backdrop-filter:blur(6px)}
.wa svg{width:34px;height:34px}
.addr{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:19px;font-weight:600}
</style></head><body><div class="post">
<div class="top"></div><div class="bot"></div>
<div class="logo"><img src="../src/logo.jpg"></div>
<div class="head">HEAD</div>
<div class="foot">

</div></body></html>
